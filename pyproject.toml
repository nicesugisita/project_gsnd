[project]
name = "gsnd-rag-api"
version = "1.0.0"
description = "경상남도청 RAG 챗봇 API"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Web Framework
    "fastapi==0.115.2",
    "uvicorn[standard]==0.30.0",
    "python-multipart==0.0.9",
    "pydantic==2.4.2",
    "pydantic-settings==2.0.3",

    # HTTP Client
    "httpx==0.27.0",
    "requests==2.31.0",

    # Environment Configuration
    "python-dotenv==1.0.0",

    # Tokenization
    "tiktoken==0.5.2",

    # Logging
    "python-json-logger==2.0.7",

    # Type Checking
    "typing-extensions==4.8.0",

    # STT (Speech-to-Text)
    "websocket-client==1.9.0",
    "websockets==12.0",
    "pyaudio==0.2.14",

    # Database
    "mysql-connector-python==8.2.0",

    # JVM (Mariner 검색엔진 연동)
    "jpype1>=1.5.0",
]

[tool.uv]
