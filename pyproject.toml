[project]
name = "gsnd-rag-api"
version = "1.0.0"
description = "경상남도청 RAG 챗봇 API"
requires-python = ">=3.11,<4"
dependencies = [
    "fastapi==0.115.2",
    "uvicorn[standard]==0.30.0",
    "python-multipart==0.0.9",
    "pydantic==2.13.3",
    "pydantic-settings==2.11.0",
    "httpx==0.27.0",
    "requests==2.31.0",
    "python-dotenv==1.0.0",
    "tiktoken==0.12.0",
    "kiwipiepy",
    "numpy>=1.19.0",
    "python-json-logger==2.0.7",
    "typing-extensions==4.15.0",
    "websocket-client==1.9.0",
    "websockets==12.0",
    "pyaudio==0.2.14; python_version < '3.13'",
    "mysql-connector-python==8.2.0",
    "jpype1==1.7.0",
    "cachetools==5.3.3",
    "async-lru==2.0.4",
]

[project.scripts]
gsnd-api = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
# src/ 레이아웃: 패키지를 editable 모드로 설치하면 PYTHONPATH 없이 동작
# uv sync 또는 uv pip install -e . 실행 후 uvicorn app.application:app 가능
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "pyyaml>=6.0",  # tests/llm_eval YAML 케이스 파일 로더
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-m", "not llm_eval"]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "llm_eval: hits a real LLM; run with `pytest -m llm_eval`",
    "slow: long-running tests excluded from the default fast suite",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (line-length로 대신 제어)
    "B008",  # do not perform function calls in default arguments (FastAPI Depends 패턴)
    "RUF012",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
