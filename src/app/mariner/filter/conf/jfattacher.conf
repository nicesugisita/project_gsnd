cyberdigm_port = 
cyberdigm_context = 
cyberdigm_debug =
cyberdigm_https =

#-----------------------------------------------------------------------------
# watchman_skip_count >= 1 / default: 1
#
# 		the number to skip workingFile index if the watchman process is dead
#-----------------------------------------------------------------------------
watchman_skip_count = 

#####################################
#
# 7. Extension Setting
#
# 	extension_class
#	extension_field
#
#####################################

#-----------------------------------------------------------------------------
# extension_class : extension class name
#
#		provide implementation of FattacherExtension interface
#		this option only works with external run 
#		(it doesn't work with internalDBWatcher and JDirWatcher)
#		
