
#####################################
#
# 1. JNI Filter Setting
#
# 	useJniFilter
#	useWatchman
#	vmOption
#	home
#	bulkFactor
# 	result_size
# 	dq_attach_field
#	synap_filetype_option
#	synap_filter_option
#
#####################################

#-----------------------------------------------------------------------------
# useJniFilter =	{true, false} / default: true
#
#		true : Use Java Version
#		false : Use C Version
#		내장실행(M3에서 실행)만  참조
#-----------------------------------------------------------------------------
useJniFilter = true

#-----------------------------------------------------------------------------
# useWatchman =	{true, false} / default: true
#
#		true : Filter using external java process
#		false : Filter using internal java process
#		내장, 외장(DQJFA단독실행) 모두 참조
#-----------------------------------------------------------------------------
useWatchman = true

#-----------------------------------------------------------------------------
# vmOption (if use useWatchman option)
#
#		It is needed when external java process runs
#		if useDiffProcess is true.
#		Djava path has to be included in vmOption.
#		ex) -Djava.library.path=/home/user/DQJFA/lib/linux
#       내장, 외장 모두 참조
#-----------------------------------------------------------------------------
vmOption = -Djava.library.path=/data/mariner5/util/filter/lib/linux_64bit

#-----------------------------------------------------------------------------
# home (if use useWatchman option)
#
#		Home directory of DQJFAttacher.
#		It is needed when external java process runs
#		외장만 참고(for classpath)
#-----------------------------------------------------------------------------
home = /data/mariner5/util/filter

#-----------------------------------------------------------------------------
# bulkFactor (if use useWatchman option)
#
#		The number of documents that make working file
#		when use external java process. (not the number of files)
#		The process starts to filtering when the number of documents is a bulkFactor.
#		외장만 참고
#-----------------------------------------------------------------------------
bulkFactor = 1000

#-----------------------------------------------------------------------------
# result_size >= 0
#
#		Limit result character size each document.
#		0 : Print all character in document
#-----------------------------------------------------------------------------
result_size = 0

#-----------------------------------------------------------------------------
# dq_attach_field
#
#		Field name in DQDOC will be filtered.
#		This is used only applied External Execution.
#-----------------------------------------------------------------------------
dq_attach_field = PATH

#-----------------------------------------------------------------------------
# synap_filetype_option
#
#		Set synap file type options.
#		ex) SN3FILETYPE_DOC, SN3FILETYPE_PPT
#-----------------------------------------------------------------------------
synap_filetype_option = 

#-----------------------------------------------------------------------------
# synap_filter_option
#
#		Set synap filtering options.
#		ex) SN3OPTION_ARCHIVE_EXTRACT, SN3OPTION_PST_EMAIL_ATTACH
#-----------------------------------------------------------------------------
synap_filter_option =


#####################################
#
# 2. Attached File Setting
#
# 	ext_delimiter
# 	ext_case_sensitive
# 	ext_m2_tagremover
# 	ext_nofilter
# 	ext_ignore
# 	remain_filename
# 	output_encoding
# 	ext_utf8
# 	ext_mscp949
# 	ext_eucjp
# 	utf8_pattern
#	remain_filename
#	output_encoding
#	file_size_limit
#
#####################################

#-----------------------------------------------------------------------------
# ext_delimiter
#
# 		Delimiter for setting in 'jfattacher.conf'. (ex "html,hwp")
#-----------------------------------------------------------------------------
ext_delimiter=,

#-----------------------------------------------------------------------------
# ext_case_sensitive =	{true, false} / default: false
#
#		Case sensitive for setting in 'jfattacher.conf'.
#-----------------------------------------------------------------------------
ext_case_sensitive = false

#-----------------------------------------------------------------------------
# ext_m2_tagremover : file suffix
#
#		The file suffix list used to filter files using 'tag remover in jfattacher' instead of 'tag remover in sn3 filter'.
#		ex) ext_m2_tagremover = html, jsp
#-----------------------------------------------------------------------------
#ext_m2_tagremover = html, jsp

#-----------------------------------------------------------------------------
# ext_nofilter : file suffix
#
#		The file suffix list used to filter files using 'jfattacher' instead of 'sn3 filter'.
#		ex) ext_nofilter = txt, html
#-----------------------------------------------------------------------------
#ext_nofilter = txt

#-----------------------------------------------------------------------------
# ext_ignore : file suffix
#
#		The file suffix list is not filtered.
#		ex) ext_ignore = jpg, avi, wmv, iso, cab, z
#-----------------------------------------------------------------------------
ext_ignore = jpg, avi, wmv, iso, cab, z

#-----------------------------------------------------------------------------
# remain_filename  =	{true, false} / default: true
#
#
#-----------------------------------------------------------------------------
remain_filename = true

#-----------------------------------------------------------------------------
# output_encoding : encoding / default : MS949
#
#		Explicitly decode string in DQDOC file from specified encoding.
#		This is used only external execution.
#-----------------------------------------------------------------------------
output_encoding = MS949

#-----------------------------------------------------------------------------
# file_size_limit : file size / default : 0 (no limit)
#		You can limit the size of the files to be filtered.(byte)
#-----------------------------------------------------------------------------
file_size_limit = 0

#-----------------------------------------------------------------------------
# auto_detect_encoding : {true / false} / default : true
#		Automatically detects encoding when reading non-filtering(ex : ext_m2_tagremover, ext_nofilter ) files
#-----------------------------------------------------------------------------
auto_detect_encoding = false


#####################################
#
# 3. HTTP & FTP/SFTP Setting
#
# 	http_conn_timeout
# 	http_read_timeout
# 	max_download_size
# 	utf8_domain
# 	temp_directory
#	http_header
# 	domain1
# 	domain2
#	file_name_encoding
#	passive_mode
#	useEncryption
#
#####################################

#-----------------------------------------------------------------------------
# http_conn_timeout >= 0, milliseconds
#
#		HTTP connection timeout (default : 3000)
#		ex) 3000
#
# http_read_timeout >= 0, milliseconds
#
#		HTTP read timeout (defalut : 10000)
#		ex) 3000
#
# ftp/sftp_conn_timeout >= 0, milliseconds
#
#		FTP/SFTP connection timeout (default : 3000)
#		ex) 3000
#-----------------------------------------------------------------------------
http_conn_timeout =
http_read_timeout =
ftp_sftp_conn_timeout =

#-----------------------------------------------------------------------------
# max_download_size >= 0
#
#		This is used only applied http setting is set.
#		Limit file size(KByte) expression can use. (10M = 10240)
#		Zero(0) is not downloaded.
#		ex) max_download_size = 10240
#
#-----------------------------------------------------------------------------
max_download_size = 10240

#-----------------------------------------------------------------------------
# utf8_domain = domain name
#
#		Write domain name if domain is encoded utf8.
#		ex) utf8_domain = www.utf8.com, www.utf8domain.com
#-----------------------------------------------------------------------------
utf8_domain =

#-----------------------------------------------------------------------------
# temp_directory = temporary download directory
#
#		This is used only applied max_download_size or sftp setting is set.
#		Setting to file-name encoding(defalut:EUC-KR).
#		ex) temp_directory = D:\\jfattacher\\temp
#		ex) file_name_encoding = UTF-8
#-----------------------------------------------------------------------------
temp_directory =
file_name_encoding =

#-----------------------------------------------------------------------------
# http_header = http/https request header value
#
#		this option for http/https only.
#		Setting to request header value
#		USAGE : key[:]value
#
#		ex) http_header1 = User-Agent:curl/7.54.0
#		ex) http_header2 = Accept-Language:en-US,en;q=0.5
#-----------------------------------------------------------------------------
http_header1 =
http_header2 =

#-----------------------------------------------------------------------------
#	ftp/sftp setting
#
#		ftp/sftp setting to collect attach file from other servers that service ftp/sftp.
#		Note that This is not affected by 'max_download_size' setting.
#		Note that IP or Hostname must match the incoming IP or Hostname.
#		USAGE : ip[tab]port[tab]user[tab]password
#
#		ex) [FTP]	: domain1 = 113.232.11.22	21	userId	password
#		ex) [SFTP]	: domain1 = 114.214.54.44	22	userId	password
#-----------------------------------------------------------------------------
domain1 =
domain2 =

#-----------------------------------------------------------------------------
#	passive_mode = {true, false} / default: false
#
#		this option for ftp only.
#		setting the data transfer mode of ftp. 
#		ftp usually works as active_mode, but sometimes acts as passive_mode.
#
#-----------------------------------------------------------------------------
passive_mode = false

#-----------------------------------------------------------------------------
#	sftp_key_path = sftp key file path
#
#		this option for sftp only.
#		setting the authentication key file path 
#
#-----------------------------------------------------------------------------
sftp_key_path =

#-----------------------------------------------------------------------------
#	use_encryption = Password Encryption Option
#
#		Use password of accounts encryption for ftp/sftp setting
#
#-----------------------------------------------------------------------------
use_encryption = false

#####################################
#
# 4. Log Setting
#
# 	log_dir
# 	log_file
#	log_retention_period
#
#####################################

#-----------------------------------------------------------------------------
# log_dir = log directory
#
#	ex) log_dir = D:\\jfattacher\\log
#
# log_file = log file name
#
#	ex) log_file = dqjfattacher.log
#
# log_retention_period = log file retention period
#
#   ex) log_retention_period = 7
#
#-----------------------------------------------------------------------------
log_dir = 
log_file = 
log_retention_period = 7

#####################################
#
# 5. Debug Setting
#
# 	print_filename
#	print_docinfo_fail
#	print_synap_call
#
#####################################

#-----------------------------------------------------------------------------
# print_filename =	{true, false} / default: false
#
# 		true : print input file name
#-----------------------------------------------------------------------------
print_filename = false

#-----------------------------------------------------------------------------
# print_docinfo_fail =	{true, false} / default: true
#
# 		Print error message when document meta info get failed  
#-----------------------------------------------------------------------------
print_docinfo_fail = true

#-----------------------------------------------------------------------------
# print_synap_call =	{true, false} / default: false
#
# 		Print start and end of a synap method call  
#-----------------------------------------------------------------------------
print_synap_call = false

#####################################
#
# 6. Extra Setting
#
# 	use_docuworks
#	remove_localfile
#	cyberdigm_ip
#	cyberdigm_port
#	cyberdigm_context
#	cyberdigm_debug
#	watchman_skip_count	
#
#####################################

#-----------------------------------------------------------------------------
# ext_utf8 : file suffix
#
#		The file suffix list is decoded utf8 encoding
#		ex) ext_utf8 = txt, asp, jsp,
#
# ext_mscp949 : file suffix - not support
#
#		The file suffix list is decoded ms949 or cp949 encoding
#
# ext_eucjp : file suffix - not support
#
#		The file suffix list is decoded eucjp encoding
#
# utf8_pattern : file suffix - not support
#
#		utf8 pattern
# to do encoding list
#ext_mscp949 =
#ext_eucjp =
#utf8_pattern =
#-----------------------------------------------------------------------------
ext_utf8 =

#-----------------------------------------------------------------------------
# use_docuworks =	{true, false} / default: false
#
# 		Use xdw filter for fuji xerox (only WINDOWS, DocuWork Program must already been installed.)
#-----------------------------------------------------------------------------
use_docuworks = false

#-----------------------------------------------------------------------------
# remove_localfile =	{true, false} / default: false
#
# 		Remove local files, and then filtered
#-----------------------------------------------------------------------------
remove_localfile = false

#-----------------------------------------------------------------------------
#
# --Options are for cyberdigm only--
#
# cyberdigm_ip = cyberdigm fileserver ip 
#
#		ex) 114.214.54.44
#
# cyberdigm_port = cyberdigm fileserver port
#
#		ex) 1235
